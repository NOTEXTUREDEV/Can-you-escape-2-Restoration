name: Build 64-bit AIR APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout game files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download HARMAN AIR SDK
        shell: pwsh
        run: |
          mkdir airsdk
          Invoke-WebRequest -Uri "https://harman.com" -OutFile "airsdk.zip"
          Expand-Archive -Path "airsdk.zip" -DestinationPath "airsdk"

      - name: Package 64-bit APK
        shell: pwsh
        run: |
          & ".\airsdk\bin\adt.bat" -certificate -cn "SelfSigned" 2048-RSA cert.p12 password123
          & ".\airsdk\bin\adt.bat" -package -target apk-captive-runtime -arch armv8 -storetype pkcs12 -keystore cert.p12 -storepass password123 CYE2_64bit.apk META-INF/AIR/application.xml .

      - name: Upload 64-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: CYE2-64bit-APK
          path: CYE2_64bit.apk
