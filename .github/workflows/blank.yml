name: Build 64-bit AIR APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Adobe AIR SDK
        uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: '51.1'
          accept-license: true

      - name: Package 64-bit APK
        run: |
          ls -la
          file CYE2_Ironsource.swf
          python3 -c '
          xml = """<?xml version="1.0" encoding="UTF-8"?>
          <application xmlns="http://adobe.com">
            <id>com.textureless.canyouescape2restoration</id>
            <versionNumber>3.9.0</versionNumber>
            <filename>CanYouEscape2</filename>
            <name>Can You Escape 2</name>
            <initialWindow>
              <content>CYE2_Ironsource.swf</content>
              <visible>true</visible>
              <fullScreen>true</fullScreen>
              <aspectRatio>landscape</aspectRatio>
              <renderMode>cpu</renderMode>
              <autoOrients>false</autoOrients>
            </initialWindow>
            <android>
              <manifestAdditions><![CDATA[<manifest>
                <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
                <uses-permission android:name="android.permission.WAKE_LOCK"/>
                <application android:enabled="true">
                  <activity android:excludeFromRecents="false">
                    <intent-filter>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                  </activity>
                </application>
              </manifest>]]></manifestAdditions>
            </android>
          </application>"""
          open("app.xml", "w").write(xml)
          '
          adt -certificate -cn "SelfSigned" 2048-RSA cert.p12 password123
          adt -package -target apk-captive-runtime -arch armv8 -storetype pkcs12 -keystore cert.p12 -storepass password123 CYE2_64bit.apk app.xml CYE2_Ironsource.swf

      - name: Upload 64-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: CYE2-64bit-APK
          path: CYE2_64bit.apk
