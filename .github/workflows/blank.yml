name: Build 64-bit AIR APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Adobe AIR SDK
        uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: '51.2'
          accept-license: true

      - name: Package 64-bit APK
        run: |
          adt -certificate -cn "SelfSigned" 2048-RSA cert.p12 password123
          adt -package -target apk-captive-runtime -arch armv8 -storetype pkcs12 -keystore cert.p12 -storepass password123 CYE2_64bit.apk application.xml CYE2_Ironsource.swf

      - name: Upload 64-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: CYE2-64bit-APK
          path: CYE2_64bit.apk
